name: Deploy dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-dashboard.yml'

concurrency:
  group: github-pages-deployment
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v4.4.0

      - name: Verify dashboard files exist
        run: test -s site/index.html && test -s site/data/runs.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload static dashboard
        id: pages-artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site

      - name: Verify Pages artifact upload
        env:
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"

  deploy:
    needs: upload
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
        with:
          artifact_name: github-pages
