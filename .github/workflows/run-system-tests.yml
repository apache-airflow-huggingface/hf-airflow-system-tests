name: Run Hugging Face system tests

on:
  workflow_dispatch:
    inputs:
      airflow_ref:
        description: Airflow branch, tag, or commit SHA
        required: true
        default: main
        type: string
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: huggingface-system-tests-history
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  system-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AIRFLOW_REF: ${{ inputs.airflow_ref || 'main' }}
      # Use Airflow's published CI image cache as the starting point. Breeze
      # checks the checked-out source hash and rebuilds when that source differs.
      # Keep this the same for `ci-image build` and `testing system-tests`.
      BREEZE_GITHUB_REPOSITORY: apache/airflow
      BREEZE_PYTHON: '3.11'
      # Non-interactive: auto-answer Breeze's rebuild/remove prompts.
      ANSWER: 'yes'
    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v7.0.1

      - name: Check out Airflow
        uses: actions/checkout@v7.0.1
        with:
          repository: apache/airflow
          ref: ${{ env.AIRFLOW_REF }}
          path: airflow
          fetch-depth: 1

      - name: Record run metadata
        id: start
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up uv for Breeze
        uses: astral-sh/setup-uv@v10.4.0

      - name: Free disk space for CI image build
        uses: endersonmenezes/free-disk-space@v4.1.0
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          rm_cmd: rmz
          rmz_version: '3.2.1'

      - name: Remove unused CodeQL bundle
        run: sudo rm -rf /opt/hostedtoolcache/CodeQL || true

      - name: Build Breeze CI image
        working-directory: airflow
        run: |
          AIRFLOW_ROOT_PATH="$PWD" uv run --project dev/breeze --locked --quiet \
            breeze ci-image build \
              --python "$BREEZE_PYTHON" \
              --platform linux/amd64 \
              --github-repository "$BREEZE_GITHUB_REPOSITORY"
          docker image ls | grep -i "ci/python${BREEZE_PYTHON}" || {
            echo "CI image was not built for ${BREEZE_GITHUB_REPOSITORY}" >&2
            exit 1
          }

      - name: Run provider system tests with Breeze
        id: tests
        working-directory: airflow
        env:
          HF_TOKEN_AIRFLOW: ${{ secrets.HF_TOKEN_AIRFLOW }}
          HF_TEST_HUB_ORG: airflow-hf
        run: bash ../scripts/run_system_tests.sh

      - name: Ensure JUnit XML exists for history summarizer
        if: always()
        working-directory: airflow
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: python3 ../scripts/ensure_junit.py junit.xml "${TEST_EXIT_CODE:-1}"

      - name: Sanitize JUnit report for artifact
        if: always() && hashFiles('airflow/junit.xml') != ''
        run: python3 scripts/sanitize_junit.py airflow/junit.xml junit-sanitized.xml

      - name: Upload JUnit report
        if: always() && hashFiles('junit-sanitized.xml') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: huggingface-system-test-junit-${{ github.run_id }}
          path: junit-sanitized.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare history metadata
        if: always()
        env:
          STARTED_AT: ${{ steps.start.outputs.started_at }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: |
          python3 scripts/prepare_history_metadata.py \
            --airflow-path airflow \
            --airflow-ref "$AIRFLOW_REF" \
            --started-at "${STARTED_AT:-}" \
            --exit-code "${TEST_EXIT_CODE:-1}" \
            --output history-metadata.json

      - name: Upload run history inputs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: huggingface-system-test-history-${{ github.run_id }}
          path: |
            junit-sanitized.xml
            history-metadata.json
          if-no-files-found: error
          retention-days: 1

  update-history:
    needs: system-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v7.0.1

      - name: Download run history inputs
        uses: actions/download-artifact@v8.0.2
        with:
          name: huggingface-system-test-history-${{ github.run_id }}
          path: history-inputs

      - name: Record run and update history
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/summarize_junit.py \
            --junit history-inputs/junit-sanitized.xml \
            --output /tmp/hf-system-test-run.json \
            --history site/data/runs.json \
            --metadata history-inputs/history-metadata.json \
            --run-url "$RUN_URL" \
            --run-id "$RUN_ID"

      - name: Sanitize public run history
        run: python3 scripts/sanitize_runs.py site/data/runs.json

      - name: Commit updated run history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f site/data/runs.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Hugging Face system test run $GITHUB_RUN_ID"
            push_succeeded=false
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
                push_succeeded=true
                break
              fi
              echo "Push attempt $attempt failed, retrying in 3s..."
              sleep 3
            done
            if [[ "$push_succeeded" != true ]]; then
              exit 1
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload dashboard for this workflow run
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy-pages:
    needs: update-history
    if: always() && needs.update-history.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard from this workflow run
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages
